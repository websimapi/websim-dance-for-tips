<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dance for Tips</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
          "marked": "https://cdn.jsdelivr.net/npm/marked/lib/marked.esm.js",
          "dompurify": "https://cdn.jsdelivr.net/npm/dompurify/dist/purify.es.min.js"
        }
      }
    </script>
</head>
<body>
    <div id="main-container">
        <div id="dance-floor">
            <h1 id="status-text">Waiting for the host to start dancing...</h1>
            <!-- This is where the Three.js canvas will go -->
            <div id="three-container"></div>
            <!-- Live comments will float up here -->
            <div id="live-comments-container"></div>
            <!-- The host's webcam feed (can be hidden) -->
            <video id="webcam-feed" style="display: none;"></video>
        </div>

        <div id="side-panel">
            <div id="youtube-player-container">
                <div id="youtube-player"></div>
            </div>
            <div id="controls">
                <input type="text" id="youtube-url-input" placeholder="Paste a YouTube URL here">
                <button id="youtube-url-submit">Set Video</button>
            </div>
            
            <div id="comment-section">
                <h2>Live Chat & Tips</h2>
                <div id="comments-list"></div>
                <div id="comment-form">
                    <textarea id="comment-input" placeholder="Say something nice..."></textarea>
                    <input type="number" id="tip-input" placeholder="Tip (optional, min 10)">
                    <button id="submit-comment">Send</button>
                </div>
            </div>
        </div>
    </div>

    <!-- YouTube IFrame API -->
    <script src="https://www.youtube.com/iframe_api"></script>
    <script type="module" src="script.js"></script>
<script defer src="https://static.cloudflareinsights.com/beacon.min.js/v8c78df7c7c0f484497ecbca7046644da1771523124516" integrity="sha512-8DS7rgIrAmghBFwoOTujcf6D9rXvH8xm8JQ1Ja01h9QX8EzXldiszufYa4IFfKdLUKTTrnSFXLDkUEOTrZQ8Qg==" data-cf-beacon='{"version":"2024.11.0","token":"4c6229722a6346bc8eb5cb0e5eae5d41","server_timing":{"name":{"cfCacheStatus":true,"cfEdge":true,"cfExtPri":true,"cfL4":true,"cfOrigin":true,"cfSpeedBrain":true},"location_startswith":null}}' crossorigin="anonymous"></script>
</body>
</html>
